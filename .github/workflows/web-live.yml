name: web-live

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  ZONE_ID: 1513251

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      BACKEND_URL: https://api.btree.at/api
      #BACKEND_URL_US: https://us.api.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install PWA dependencies
        run: pnpm --dir src-pwa install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build PWA
        run: pnpm build:pwa
      - name: List output files
        run: ls

      - name: Upload files to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: app-btree-at
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
          BUNNY_S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
          BUNNY_STORAGE_ZONE: app-btree-at
          PUBLIC_URL: https://app.btree.at
        run: bash scripts/upload-bunny.sh dist/pwa

      - name: Purge BunnyCDN
        uses: fjogeleit/http-request-action@f98bb26551cd1af7d3eb2674578a80754ece88db # v2.0.1
        with:
          url: 'https://api.bunny.net/pullzone/${{env.ZONE_ID}}/purgeCache'
          method: POST
          customHeaders: '{ "AccessKey": "${{ secrets.BUNNY_KEY }}"}'
